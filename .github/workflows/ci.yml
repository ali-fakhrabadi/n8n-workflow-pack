name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  checks:
    name: Lint, export and event checks, Code node unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the linter (hash-checked)
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Lint and format (Python)
        run: |
          ruff check .
          ruff format --check .
      - name: Committed workflow JSON matches its definition
        run: python3 scripts/build_workflows.py --check
      - name: Committed events match their generator
        run: python3 tests/events/generate.py --check
      - name: Workflow JSON is valid and every connection points at a node
        run: |
          python3 - <<'EOF'
          import json, pathlib
          for path in sorted(pathlib.Path("workflows").glob("*.json")):
              wf = json.loads(path.read_text(encoding="utf-8"))
              names = {n["name"] for n in wf["nodes"]}
              assert len(names) == len(wf["nodes"]), f"{path}: duplicate node names"
              for source, outputs in wf["connections"].items():
                  assert source in names, f"{path}: {source}"
                  for output in outputs["main"]:
                      for target in output:
                          assert target["node"] in names, f"{path}: {target['node']}"
              for node in wf["nodes"]:
                  for ref in (node.get("credentials") or {}).values():
                      assert set(ref) == {"id", "name"}, f"{path}: credential values in {node['name']}"
              print(path, len(wf["nodes"]), "nodes ok")
          EOF
      - name: Code node unit tests
        run: node --test tests/unit/*.test.mjs

  harness:
    name: Replay harness - recorded events against a fresh n8n 2.45.6
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Replay all events (fresh stack, throw-away secrets, removed afterwards)
        run: tests/harness/run.sh
      - name: Summary
        if: always()
        run: |
          if [ -f tests/harness/out/harness-report.json ]; then
            python3 -c "import json; r = json.load(open('tests/harness/out/harness-report.json')); print(json.dumps(r['summary'], indent=2))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Harness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-report
          path: tests/harness/out/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1
